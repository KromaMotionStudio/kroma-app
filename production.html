<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kroma — Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<style>
.pd-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.pd-sum .card{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.pd-sum b{font-size:21px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pd-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.scene{margin-bottom:16px;overflow:hidden;animation:k-rise .5s var(--ease-out) both}
.scene .sh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.scene .sh .nm{font-weight:600;font-size:15px;border:0;background:none;outline:0;padding:2px 0;min-width:60px;flex:1}
.scene .sh .nm:focus{box-shadow:0 1px 0 #444}
.scene .sh .meta{color:var(--mute);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scene .sh .progress{width:90px}
.scene .sh .progress i{background:var(--c-production)}
.task{display:grid;grid-template-columns:118px minmax(0,1fr) 160px 150px 36px;align-items:center;gap:12px;padding:8px 18px;border-bottom:1px solid #1a1a1a;transition:background .2s}
.task:hover{background:#161616}
.task:last-of-type{border-bottom:0}
.st{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--mute);cursor:pointer;font-size:12.5px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.st i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.st.doing{color:var(--c-production);border-color:color-mix(in srgb,var(--c-production) 40%,transparent)}
.st.doing i{background:currentColor;animation:k-pulse 1.6s infinite}
.st.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.st.done i{background:currentColor;border-color:currentColor}
.task .tt{border:0;background:none;outline:0;padding:6px 0;font-size:14px}
.task .tt:focus{box-shadow:0 1px 0 #444}
.task.isdone .tt{color:var(--mute);text-decoration:line-through}
.task select{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:#0e0e0e;color:var(--ink);font-size:12.5px;outline:0;width:100%}
.tm{display:flex;align-items:center;gap:6px;justify-self:end}
.tm .clk{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute);min-width:62px;text-align:right}
.tm.run .clk{color:var(--ink)}
.tm .ibtn{width:32px;height:32px;border:1px solid var(--line)}
.tm.run .ibtn{background:var(--c-production);color:#0a0a0a;border-color:transparent}
.newtask{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--mute)}
.newtask input{flex:1;height:34px;border:0;background:none;outline:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:1100px){.task{grid-template-columns:118px minmax(0,1fr) 130px 140px 36px}}
@media (max-width:900px){.pd-sum{grid-template-columns:1fr 1fr}.task{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"s s s" "t t t" "a m d";row-gap:6px;padding:12px 16px}.task>.st{grid-area:s;justify-self:start}.task>.tt{grid-area:t}.task>.del{grid-area:d}.task>select{grid-area:a}.task>.tm{grid-area:m}.scene .sh .progress{display:none}.scene .sh .nm{min-width:0}}
</style>
</head>
<body>
<script>
K.boot({ active: 'production', stage: 'production', needProject: true, render: async ({ view, project: p }) => {
  const { el, h, icon, esc, $ } = K;
  K.setCrumbs([{ label: 'Projets', href: 'projets.html' }, { label: p.name, href: 'projet.html?p=' + p.id }, { label: 'Production' }]);
  const add = el('button', 'btn'); add.type = 'button'; add.innerHTML = icon('plus', 16) + '<span>Scène</span>';
  view.append(K.stageHeader(p, 'production', { actions: [add] }));
  const sum = el('div', 'pd-sum'), bar = el('div', 'pd-bar'), list = el('div'); view.append(sum, bar, list);
  let tasks = await K.db.tasks(p.id);
  const members = K.state.members.length ? K.state.members : [K.state.me];
  const who = e => { const m = members.find(x => (x.email || '').toLowerCase() === String(e || '').toLowerCase()); return m ? (m.name || m.email.split('@')[0]) : (e || ''); };
  const STATUS = { todo: 'À faire', doing: 'En cours', done: 'Fait' }, NEXT = { todo: 'doing', doing: 'done', done: 'todo' };
  let filter = K.store.get('kroma-pd-filter', 'all'); let extraScenes = [];
  const secs = t => (t.seconds || 0) + (t.started_at ? Math.max(0, (Date.now() - new Date(t.started_at).getTime()) / 1000) : 0);
  const sceneOrder = () => { const s = []; tasks.forEach(t => { if (!s.includes(t.scene)) s.push(t.scene); }); extraScenes.forEach(x => { if (!s.includes(x)) s.push(x); }); return s; };
  const update = async (t, patch) => { Object.assign(t, patch); try { const r = await K.db.updateTask(t.id, patch); Object.assign(t, r); } catch (e) { K.toast(K.errMsg(e)); } };
  const stopTimer = t => { if (!t.started_at) return; const s = Math.round(secs(t)); return update(t, { seconds: s, started_at: null }); };
  const drawSum = () => {
    const done = tasks.filter(t => t.status === 'done').length, total = tasks.reduce((a, t) => a + secs(t), 0);
    const by = {}; tasks.forEach(t => { const k = who(t.assignee) || 'Non assigné'; by[k] = (by[k] || 0) + secs(t); });
    sum.innerHTML = '<div class="card"><span class="lab">Tâches</span><b>' + done + ' / ' + tasks.length + '</b><div class="progress"><i style="width:' + (tasks.length ? Math.round(done / tasks.length * 100) : 0) + '%;background:var(--c-production)"></i></div></div>' +
      '<div class="card"><span class="lab">En cours</span><b>' + tasks.filter(t => t.status === 'doing').length + '</b></div>' +
      '<div class="card"><span class="lab">Temps passé</span><b class="tot">' + K.duration(total) + '</b></div>' +
      '<div class="card"><span class="lab">Par personne</span><span style="font-size:13px;line-height:1.6">' + (Object.keys(by).length ? Object.entries(by).map(([k, v]) => esc(k) + ' · <span class="muted">' + K.duration(v) + '</span>').join('<br>') : '<span class="muted">—</span>') + '</span></div>';
  };
  const drawBar = () => {
    bar.textContent = ''; const ch = el('div', 'tabs');
    [['all', 'Toutes'], ...members.map(m => [m.email, m.name || m.email.split('@')[0]]), ['none', 'Non assignées']].forEach(([k, l]) => { const b = el('button'); b.type = 'button'; b.className = filter === k ? 'on' : ''; b.textContent = l; b.onclick = () => { filter = k; K.store.set('kroma-pd-filter', k); draw(); }; ch.append(b); });
    bar.append(ch, h('<span class="lab">Clique sur le statut pour le faire avancer · le chrono s\'arrête quand la tâche passe à « Fait »</span>'));
  };
  const row = t => {
    const r = el('div', 'task' + (t.status === 'done' ? ' isdone' : ''));
    const st = el('button', 'st ' + t.status); st.type = 'button'; st.innerHTML = '<i></i>' + STATUS[t.status]; st.title = 'Passer à « ' + STATUS[NEXT[t.status]] + ' »';
    st.onclick = async () => { const n = NEXT[t.status]; if (n === 'done' && t.started_at) await stopTimer(t); await update(t, { status: n }); draw(); };
    const tt = el('input', 'tt'); tt.value = t.title; tt.maxLength = 300; tt.setAttribute('aria-label', 'Tâche'); let to; tt.oninput = () => { clearTimeout(to); const v = tt.value.trim(); if (v) to = setTimeout(() => update(t, { title: v }), 500); };
    const as = el('select'); as.setAttribute('aria-label', 'Assignée à'); [['', 'Personne'], ...members.map(m => [m.email, m.name || m.email.split('@')[0]])].forEach(([v, l]) => { const o = el('option', null, l); o.value = v; as.append(o); }); as.value = t.assignee || ''; as.onchange = async () => { await update(t, { assignee: as.value }); drawSum(); };
    const tm = el('div', 'tm' + (t.started_at ? ' run' : '')); const ck = el('span', 'clk', K.clock(secs(t))); ck.dataset.id = t.id;
    const pb = el('button', 'ibtn'); pb.type = 'button'; pb.innerHTML = icon(t.started_at ? 'pause' : 'play', 14); pb.title = t.started_at ? 'Arrêter le chrono' : 'Lancer le chrono'; pb.setAttribute('aria-label', pb.title);
    pb.onclick = async () => {
      if (t.started_at) { await stopTimer(t); }
      else { await Promise.all(tasks.filter(x => x.started_at && x.id !== t.id).map(stopTimer)); await update(t, Object.assign({ started_at: new Date().toISOString() }, t.status === 'todo' ? { status: 'doing' } : {}, !t.assignee && K.state.me.email ? { assignee: K.state.me.email } : {})); }
      draw();
    };
    tm.append(ck, pb);
    const del = el('button', 'ibtn del'); del.type = 'button'; del.innerHTML = icon('trash-2', 15); del.title = 'Supprimer la tâche'; del.setAttribute('aria-label', 'Supprimer la tâche');
    del.onclick = async () => { if (!await K.confirm('Supprimer « ' + t.title + ' » ?', t.seconds ? 'Le temps passé (' + K.duration(secs(t)) + ') sera perdu.' : 'Cette tâche sera supprimée.')) return; try { await K.db.deleteTask(t.id); tasks = tasks.filter(x => x !== t); draw(); } catch (e) { K.toast(K.errMsg(e)); } };
    r.append(st, tt, as, tm, del); return r;
  };
  const addTask = async (scene, title) => { try { const t = await K.db.addTask({ project_id: p.id, scene, title: title.slice(0, 300), position: tasks.length, assignee: filter !== 'all' && filter !== 'none' ? filter : '' }); tasks.push(t); extraScenes = extraScenes.filter(x => x !== scene); draw(); const inp = [...list.querySelectorAll('.newtask input')].find(x => x.dataset.scene === scene); if (inp) inp.focus(); } catch (e) { K.toast(K.errMsg(e)); } };
  const draw = () => {
    drawSum(); drawBar(); list.textContent = '';
    const scenes = sceneOrder();
    if (!scenes.length) { const e = h('<div class="empty"><b>Aucune tâche pour l\'instant.</b>Découpe la production en scènes, puis ajoute les tâches de chacune.</div>'); const b = el('button', 'btn primary', '+ Première scène'); b.onclick = () => add.click(); e.append(b); list.append(e); return; }
    scenes.forEach((sc, i) => {
      const all = tasks.filter(t => t.scene === sc);
      const vis = all.filter(t => filter === 'all' || (filter === 'none' ? !t.assignee : (t.assignee || '').toLowerCase() === filter.toLowerCase()));
      const done = all.filter(t => t.status === 'done').length;
      const box = el('section', 'card scene'); box.style.animationDelay = Math.min(i, 10) * 40 + 'ms';
      const sh = el('div', 'sh'); const nm = el('input', 'nm'); nm.value = sc || 'Sans scène'; nm.setAttribute('aria-label', 'Nom de la scène');
      nm.onchange = async () => { const v = nm.value.trim().slice(0, 120); if (!v || v === sc) { nm.value = sc || 'Sans scène'; return; } await Promise.all(all.map(t => update(t, { scene: v }))); extraScenes = extraScenes.map(x => x === sc ? v : x); draw(); };
      const pr = h('<div class="progress"><i style="width:' + (all.length ? Math.round(done / all.length * 100) : 0) + '%"></i></div>');
      sh.append(nm, pr, el('span', 'meta', done + '/' + all.length + ' · ' + K.duration(all.reduce((a, t) => a + secs(t), 0))));
      box.append(sh); vis.forEach(t => box.append(row(t)));
      const nt = el('form', 'newtask'); nt.innerHTML = icon('plus', 16); const ni = el('input'); ni.placeholder = 'Nouvelle tâche dans « ' + (sc || 'Sans scène') + ' »…'; ni.dataset.scene = sc; ni.maxLength = 300; nt.append(ni);
      nt.onsubmit = e => { e.preventDefault(); const v = ni.value.trim(); if (v) addTask(sc, v); };
      box.append(nt); list.append(box);
    });
  };
  add.onclick = async () => { const v = await K.dialog({ title: 'Nouvelle scène', fields: [{ k: 'name', label: 'Nom de la scène', placeholder: 'Ex. Intro, Démo produit, Outro', required: true, max: 120 }, { k: 'task', label: 'Première tâche (facultatif)', placeholder: 'Ex. Animation du logo', max: 300 }], ok: 'Ajouter' }); if (!v) return; const n = v.name.trim(); if (v.task.trim()) addTask(n, v.task.trim()); else { extraScenes.push(n); draw(); const inp = [...list.querySelectorAll('.newtask input')].find(x => x.dataset.scene === n); if (inp) inp.focus(); } };
  draw();
  setInterval(() => { list.querySelectorAll('.clk[data-id]').forEach(c => { const t = tasks.find(x => x.id === c.dataset.id); if (t && t.started_at) c.textContent = K.clock(secs(t)); }); if (tasks.some(t => t.started_at)) { const tot = $('.tot', sum); if (tot) tot.textContent = K.duration(tasks.reduce((a, t) => a + secs(t), 0)); } }, 1000);
  if (K.db.subscribe) K.db.subscribe('tasks', 'project_id=eq.' + p.id, async () => { if (document.activeElement && document.activeElement.closest('.task,.newtask')) return; try { tasks = await K.db.tasks(p.id); draw(); } catch (e) { } });
} });
</script>
</body>
</html>
