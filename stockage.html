<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kroma — Stockage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<style>
.st-cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.drv{display:flex;align-items:center;gap:16px;padding:20px 22px;margin-bottom:24px}
.drv .ic-wrap{width:44px;height:44px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;flex:none}
.drv .t{flex:1;overflow:hidden}
.drv .t b{display:block;font-weight:600}
.drv .t span{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.fgroup{margin-bottom:22px}
.fgroup h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;font-weight:500;color:var(--mute)}
.fgroup h3 .n{color:var(--dim)}
.flist{overflow:hidden}
.fi{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #1a1a1a;transition:background .2s}
.fi:last-child{border-bottom:0}
.fi:hover{background:#161616}
.fi .ico{width:36px;height:36px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;color:var(--mute);flex:none}
.fi .t{flex:1;overflow:hidden}
.fi .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .t span{color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.fi .ibtn{width:34px;height:34px}
.arch{padding:22px;display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.arch a.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);transition:background .2s,border-color .2s}
.arch a.it:hover{background:var(--surface-2);border-color:var(--line-2)}
.arch a.it .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,#161616);color:var(--c)}
.arch a.it .t{flex:1;overflow:hidden}
.arch a.it .t b{display:block;font-weight:500}
.arch a.it .t span{color:var(--mute);font-size:12.5px}
.arch .vl{display:flex;flex-direction:column;gap:6px;padding-left:4px}
.arch .vl a{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#d4d4d2}
.arch .vl a:hover{color:var(--ink)}
.as-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin:12px 0 26px}
.as-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-bottom:20px}
@media (max-width:1100px){.st-cols{grid-template-columns:1fr}.arch{position:static}}
</style>
</head>
<body>
<script>
(() => {
const { el, h, icon, esc, $ } = K;
const KINDS = [['final', 'Fichiers finaux', 'circle-check'], ['source', 'Sources', 'folder'], ['da', 'Direction artistique', 'images'], ['autre', 'Autres', 'link']];
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const fileIcon = u => /drive\.google|docs\.google/.test(u) ? 'hard-drive' : /\.(mp4|mov|webm)(\?|$)/i.test(u) ? 'film' : /\.(png|jpe?g|webp|gif|psd|ai)(\?|$)/i.test(u) ? 'image' : 'link';
const addDialog = (preset) => K.dialog({ title: 'Ajouter un lien', text: 'Colle le lien partagé (Google Drive, WeTransfer, Frame…). Rien n\'est envoyé sur le serveur : on garde juste le lien.', ok: 'Ajouter', fields: [
  { k: 'url', label: 'Lien', type: 'url', placeholder: 'https://drive.google.com/…', required: true },
  { k: 'name', label: 'Nom', placeholder: 'Ex. Master 4K, Projet After Effects', max: 200 },
  { k: 'kind', label: 'Type', type: 'select', value: preset || 'final', options: KINDS.map(k => ({ value: k[0], label: k[1] })) }] });
const row = (f, onDel, withProject) => {
  const r = el('div', 'fi');
  r.innerHTML = '<span class="ico">' + icon(fileIcon(f.url), 17) + '</span><span class="t"><b>' + esc(f.name) + '</b><span>' + esc([withProject && f.projects ? f.projects.name : '', host(f.url), K.fmt(f.created_at.slice(0, 10))].filter(Boolean).join(' · ')) + '</span></span>';
  const o = el('a', 'ibtn'); o.href = f.url; o.target = '_blank'; o.rel = 'noopener'; o.title = 'Ouvrir'; o.setAttribute('aria-label', 'Ouvrir ' + f.name); o.innerHTML = icon('external-link', 16);
  const c = el('button', 'ibtn'); c.type = 'button'; c.title = 'Copier le lien'; c.setAttribute('aria-label', 'Copier le lien'); c.innerHTML = icon('copy', 16); c.onclick = async () => { try { await navigator.clipboard.writeText(f.url); K.toast('Lien copié'); } catch (e) { K.toast(f.url); } };
  const d = el('button', 'ibtn'); d.type = 'button'; d.title = 'Retirer'; d.setAttribute('aria-label', 'Retirer ' + f.name); d.innerHTML = icon('trash-2', 15); d.onclick = () => onDel(f);
  r.append(o, c, d); return r;
};
const delFile = async (f, after) => { if (!await K.confirm('Retirer « ' + f.name + ' » ?', 'Seul le lien est retiré de Kroma : le fichier reste sur Google Drive.', 'Retirer')) return; try { await K.db.deleteFile(f.id); after(); } catch (e) { K.toast(K.errMsg(e)); } };
const create = async (pid, v) => { const url = v.url.trim(); if (!/^https?:\/\//.test(url)) { K.toast('Le lien doit commencer par https://'); return null; } return K.db.addFile({ project_id: pid, url, name: (v.name.trim() || host(url)).slice(0, 200), kind: v.kind }); };

/* ---------- Assets : tous les projets ---------- */
async function assets(view) {
  K.setCrumbs([{ label: 'Assets' }]);
  const top = el('div', 'as-top'); top.append(h('<div><div class="lab">Fichiers finaux et sources de tous les projets</div><h1 class="h1" style="margin-top:8px">Assets</h1></div>'));
  view.append(top);
  let files = await K.db.files(); let kind = 'all', q = '';
  const bar = el('div', 'as-bar'), out = el('div'); view.append(bar, out);
  const tabs = el('div', 'tabs'); const srch = h('<label class="search">' + icon('search', 16) + '<input type="search" placeholder="Rechercher un fichier ou un projet" aria-label="Rechercher un fichier"></label>'); bar.append(tabs, srch);
  $('input', srch).oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
  const draw = () => {
    tabs.textContent = ''; [['all', 'Tous'], ...KINDS.map(k => [k[0], k[1]])].forEach(([k, l]) => { const b = el('button'); b.type = 'button'; b.className = kind === k ? 'on' : ''; b.innerHTML = esc(l) + '<span class="n">' + files.filter(f => k === 'all' || f.kind === k).length + '</span>'; b.onclick = () => { kind = k; draw(); }; tabs.append(b); });
    const list = files.filter(f => (kind === 'all' || f.kind === kind) && (!q || (f.name + ' ' + f.url + ' ' + (f.projects ? f.projects.name + ' ' + f.projects.client : '')).toLowerCase().includes(q)));
    out.textContent = '';
    if (!list.length) { out.append(h('<div class="empty"><b>' + (files.length ? 'Aucun fichier ne correspond.' : 'Aucun fichier pour l\'instant.') + '</b>' + (files.length ? 'Essaie un autre mot.' : 'Ajoute les liens Drive des masters et des sources depuis l\'étape Stockage de chaque projet.') + '</div>')); return; }
    const box = el('div', 'card flist'); list.forEach(f => box.append(row(f, x => delFile(x, () => { files = files.filter(y => y !== x); draw(); }), true))); out.append(box);
  };
  draw();
}

/* ---------- Stockage d'un projet ---------- */
async function stock(view, p) {
  K.setCrumbs([{ label: 'Projets', href: 'projets.html' }, { label: p.name, href: 'projet.html?p=' + p.id }, { label: 'Stockage' }]);
  const add = el('button', 'btn'); add.type = 'button'; add.innerHTML = icon('plus', 16) + '<span>Ajouter un lien</span>';
  const acts = [add];
  if (p.status === 'livre') { const ar = el('button', 'btn'); ar.type = 'button'; ar.innerHTML = icon('archive', 16) + '<span>Archiver le projet</span>'; ar.onclick = async () => { if (!await K.dialog({ title: 'Archiver « ' + p.name + ' » ?', text: 'Il disparaît des projets en cours mais reste consultable dans l\'onglet Archivés.', ok: 'Archiver' })) return; try { await K.db.updateProject(p.id, { status: 'archive' }); K.toast('Projet archivé'); location.reload(); } catch (e) { K.toast(K.errMsg(e)); } }; acts.unshift(ar); }
  view.append(K.stageHeader(p, 'stockage', { actions: acts }));
  let files = await K.db.files(p.id);
  const cols = el('div', 'st-cols'), left = el('div'), right = el('aside', 'card arch'); cols.append(left, right); view.append(cols);
  /* dossier Drive du projet */
  const drv = el('div', 'card drv');
  const drawDrv = () => {
    drv.innerHTML = '<span class="ic-wrap">' + icon('hard-drive', 20) + '</span><span class="t"><b>Dossier du projet</b><span>' + esc(p.drive_url || 'Aucun dossier Google Drive relié pour l\'instant.') + '</span></span>';
    if (p.drive_url) { const o = el('a', 'btn sm'); o.href = p.drive_url; o.target = '_blank'; o.rel = 'noopener'; o.innerHTML = icon('external-link', 15) + '<span>Ouvrir</span>'; drv.append(o); }
    const e = el('button', 'btn sm ghost', p.drive_url ? 'Modifier' : 'Relier un dossier'); e.type = 'button';
    e.onclick = async () => { const v = await K.dialog({ title: 'Dossier Google Drive du projet', fields: [{ k: 'u', label: 'Lien du dossier', type: 'url', value: p.drive_url || '', placeholder: 'https://drive.google.com/drive/folders/…' }] }); if (!v) return; const u = v.u.trim(); if (u && !/^https?:\/\//.test(u)) { K.toast('Le lien doit commencer par https://'); return; } try { Object.assign(p, await K.db.updateProject(p.id, { drive_url: u })); drawDrv(); } catch (x) { K.toast(K.errMsg(x)); } };
    drv.append(e);
  };
  drawDrv(); left.append(drv);
  const groups = el('div'); left.append(groups);
  const drawFiles = () => {
    groups.textContent = '';
    KINDS.forEach(([k, l, ic]) => {
      const list = files.filter(f => f.kind === k);
      const g = el('section', 'fgroup'); const hh = el('h3'); hh.innerHTML = icon(ic, 15) + '<span>' + esc(l) + '</span><span class="n">' + list.length + '</span>'; g.append(hh);
      if (list.length) { const box = el('div', 'card flist'); list.forEach(f => box.append(row(f, x => delFile(x, () => { files = files.filter(y => y !== x); drawFiles(); })))); g.append(box); }
      else { const b = el('button', 'empty'); b.type = 'button'; b.style.cssText = 'display:block;width:100%;padding:18px;cursor:pointer;background:none;font:inherit'; b.textContent = '+ Ajouter ' + (k === 'final' ? 'un fichier final' : k === 'source' ? 'une source' : k === 'da' ? 'un élément de DA' : 'un lien'); b.onclick = () => addFlow(k); g.append(b); }
      groups.append(g);
    });
  };
  const addFlow = async (k) => { const v = await addDialog(k); if (!v) return; try { const f = await create(p.id, v); if (f) { files.unshift(f); drawFiles(); K.toast('Lien ajouté'); } } catch (e) { K.toast(K.errMsg(e)); } };
  add.onclick = () => addFlow('final');
  drawFiles();
  /* archive du projet */
  let frames = []; try { frames = await K.db.frames(p.id); } catch (e) { }
  const dur = frames.reduce((a, f) => a + (+f.duration || 0), 0);
  const vids = (p.videos || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const it = (k, ic, t, s, href) => { const a = el('a', 'it'); a.href = href; a.style.setProperty('--c', 'var(--c-' + k + ')'); a.innerHTML = '<span class="ico">' + icon(ic, 17) + '</span><span class="t"><b>' + esc(t) + '</b><span>' + esc(s) + '</span></span>' + icon('chevron-right', 16); return a; };
  right.append(h('<div><h2 class="h2">Archive du projet</h2><div class="lab" style="margin-top:4px">Tout ce qui a été produit, au même endroit.</div></div>'));
  right.append(it('projet', 'calendar-range', 'Brief & timeline', p.brief ? p.brief.slice(0, 60) + (p.brief.length > 60 ? '…' : '') : 'Fiche projet, budget, planning', 'projet.html?p=' + p.id));
  right.append(it('moodboard', 'images', 'Direction artistique', 'Moodboard du projet', 'moodboard.html?p=' + p.id));
  right.append(it('storyboard', 'clapperboard', 'Storyboard', frames.length ? K.plural(frames.length, 'plan', 'plans') + ' · ' + Math.round(dur) + ' s' : 'Pas encore de storyboard', 'storyboard.html?p=' + p.id));
  right.append(it('review', 'square-play', 'Versions & retours', vids.length ? K.plural(vids.length, 'vidéo', 'vidéos') + ' · ' + vids.filter(v => v.status === 'approved').length + ' validée(s)' : 'Aucune vidéo en review', 'review.html#/p/' + p.id));
  if (vids.length) { const vl = el('div', 'vl'); const L = { review: 'En revue', changes: 'À corriger', approved: 'Validée' }; vids.slice(0, 6).forEach(v => { const n = (v.versions || []).length; const a = el('a'); a.href = 'review.html#/v/' + v.id; a.innerHTML = '<span>' + esc(v.title) + ' <span class="dim">v' + Math.max(1, n) + '</span></span><span class="muted">' + esc(L[v.status] || '') + '</span>'; vl.append(a); }); right.append(vl); }
}

K.boot({ active: K.params.get('p') ? 'stockage' : 'assets', render: async ({ view, project }) => { if (project) await stock(view, project); else await assets(view); } });
})();
</script>
</body>
</html>
