<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kroma — Projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<style>
.ph-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin:12px 0 30px}
</style>
</head>
<body>
<script>
K.boot({ active: 'projets', render: async ({ view }) => {
  const { el, h, icon } = K;
  K.setCrumbs([{ label: 'Projets' }]);
  const top = el('div', 'ph-top');
  top.append(h('<div><div class="lab">' + K.plural(K.state.projects.filter(p => p.status === 'en_cours').length, 'projet en cours', 'projets en cours') + '</div><h1 class="h1" style="margin-top:8px">Projets</h1></div>'));
  const b = el('button', 'btn primary'); b.type = 'button'; b.innerHTML = icon('plus', 17) + '<span>Nouveau projet</span>'; b.onclick = () => K.newProjectDialog(); top.append(b);
  view.append(top);
  const sec = el('section'); view.append(sec);
  await K.projectGrid(sec, {});
} });
</script>
</body>
</html>
