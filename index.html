<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kroma — Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<style>
/* Accueil = tableau de production du studio : ce qui presse, où en est chaque projet, ce qui vient de bouger. */
.dash>*{animation:k-rise .7s var(--ease-out) both}
.dash>:nth-child(2){animation-delay:.05s}.dash>:nth-child(3){animation-delay:.1s}.dash>:nth-child(4){animation-delay:.15s}.dash>:nth-child(5){animation-delay:.2s}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px;padding:20px 0 30px;border-bottom:1px solid var(--line)}
.top .wk{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin-bottom:12px;font-variant-numeric:tabular-nums}
.top .wk i{width:8px;height:8px;background:var(--ink)}
.top h1{margin:0;font-size:clamp(34px,4.2vw,56px);line-height:1;font-weight:600;letter-spacing:-.04em}
.top h1 span{color:var(--dim);font-weight:400}
.top .acts{display:flex;gap:10px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.fig{display:flex;flex-direction:column;gap:6px;padding:24px 24px 24px 0;transition:opacity .2s}
.fig+.fig{padding-left:24px;border-left:1px solid var(--line)}
a.fig:hover{opacity:.75}
.fig b{font-size:clamp(34px,3.6vw,48px);line-height:1;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.fig b.warn{color:var(--danger)}
.fig span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 48px;padding-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{margin:0;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;text-transform:none}
.sec-h a{color:var(--mute);font-size:13px}.sec-h a:hover{color:var(--ink)}
.todo{display:flex;flex-direction:column}
.td{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line);transition:padding .25s var(--ease-out)}
.td:last-child{border-bottom:1px solid var(--line)}
.td:hover{padding-left:6px}
.td .c{width:8px;height:8px;border-radius:50%;background:var(--c)}
.td .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.td .t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td .t span{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td .w{color:var(--mute);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.td .w.late{color:var(--danger)}
.calm{padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mute)}
.calm b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.feed{display:flex;flex-direction:column}
.fd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.fd:last-child{border-bottom:1px solid var(--line)}
.fd .ic{color:var(--mute);margin-top:2px}
.fd .x{display:flex;flex-direction:column;gap:2px;min-width:0}
.fd .x b{font-weight:400}
.fd .x q{color:var(--mute);font-size:13px;quotes:"« " " »";overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd .x span{color:var(--dim);font-size:12px}
.fd:hover .x b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--dim)}
.pipe{margin-top:48px}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line)}
.col{display:flex;flex-direction:column;gap:8px;padding:16px 14px 20px;min-height:180px}
.col+.col{border-left:1px solid var(--line)}
.col:first-child{padding-left:0}
.col .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.col .ch span{display:flex;align-items:center;gap:8px;color:var(--ink)}
.col .ch span i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.col .ch em{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}
.pj{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .3s var(--ease-out)}
.pj:hover{border-color:#3a3a3a;transform:translateY(-2px)}
.pj b{font-weight:500;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pj span{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj .bar{height:2px;background:#262626;border-radius:1px;overflow:hidden}.pj .bar i{display:block;height:100%;background:var(--c)}
.pj .ft{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.pj .ft .late{color:var(--danger)}
.col .none{color:var(--dim);font-size:12.5px}
.empty-start{padding:64px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.empty-start b{font-size:22px;font-weight:500;letter-spacing:-.02em}
.empty-start p{margin:0;color:var(--mute);max-width:52ch;line-height:1.6}
@media (max-width:1100px){.grid{grid-template-columns:1fr;gap:40px}.cols{grid-template-columns:repeat(3,minmax(0,1fr))}.col:nth-child(4){border-left:0;padding-left:0}.col:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:700px){.figs{grid-template-columns:1fr 1fr}.fig:nth-child(3){border-left:0;padding-left:0}.fig:nth-child(n+3){border-top:1px solid var(--line)}.cols{grid-template-columns:1fr}.col{border-left:0!important;padding-left:0!important;min-height:0}.col+.col{border-top:1px solid var(--line)}.col:has(.none){display:none}.td{grid-template-columns:10px minmax(0,1fr)}.td .w{grid-column:2}}
</style>
</head>
<body>
<script>
K.boot({ active: 'home', render: async ({ view }) => {
  const { el, h, icon, esc } = K;
  K.setCrumbs([{ label: 'Accueil' }]);
  const P = K.state.projects, active = P.filter(p => p.status === 'en_cours');
  const today = K.today();
  const week = (() => { const d = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())); const n = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - n); const y = new Date(Date.UTC(d.getUTCFullYear(), 0, 1)); return Math.ceil(((d - y) / 864e5 + 1) / 7); })();
  const dash = el('div', 'dash'); view.append(dash);

  /* en-tête : la date, pas de slogan */
  const top = el('header', 'top');
  const dateTxt = today.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  top.append(h('<div><div class="wk"><i></i>Semaine ' + week + ' · ' + K.plural(active.length, 'projet en cours', 'projets en cours') + '</div><h1>' + esc(dateTxt.charAt(0).toUpperCase() + dateTxt.slice(1)) + '</h1></div>'));
  const acts = el('div', 'acts');
  const tl = el('a', 'btn'); tl.href = 'timeline.html'; tl.innerHTML = icon('calendar-range', 16) + '<span>Timeline</span>';
  const np = el('button', 'btn primary'); np.type = 'button'; np.innerHTML = icon('plus', 16) + '<span>Nouveau projet</span>'; np.onclick = () => K.newProjectDialog();
  acts.append(tl, np); top.append(acts); dash.append(top);

  if (!P.length) {
    const e = h('<section class="empty-start"><b>Aucun projet pour l\'instant.</b><p>Crée un premier projet : il porte la timeline, le moodboard, le storyboard, la production, la review et le stockage, du brief à la livraison.</p></section>');
    const b = el('button', 'btn primary', 'Créer un projet'); b.onclick = () => K.newProjectDialog(); e.append(b); dash.append(e); return;
  }

  /* chiffres clés */
  const vids = P.flatMap(p => (p.videos || []).map(v => Object.assign({ _p: p }, v)));
  const waiting = vids.filter(v => v.status === 'review'), changes = vids.filter(v => v.status === 'changes');
  const dueWeek = active.filter(K.dueThisWeek), late = active.filter(p => K.lateDays(p) > 0);
  const figs = el('section', 'figs');
  const fig = (n, label, href, warn) => { const a = el(href ? 'a' : 'div', 'fig'); if (href) a.href = href; a.innerHTML = '<b' + (warn && n ? ' class="warn"' : '') + '>' + n + '</b><span>' + esc(label) + '</span>'; return a; };
  figs.append(fig(active.length, 'projets en cours', 'projets.html'), fig(dueWeek.length, 'échéances cette semaine', 'timeline.html'), fig(late.length, late.length > 1 ? 'étapes en retard' : 'étape en retard', 'timeline.html', true), fig(waiting.length + changes.length, 'vidéos en attente ou à corriger', 'review.html'));
  dash.append(figs);

  /* à traiter + activité */
  const grid = el('section', 'grid'); dash.append(grid);
  const left = el('div'), right = el('div'); grid.append(left, right);

  const items = [];
  active.forEach(p => {
    const st = K.stage(p.stage), plan = K.plan(p), lateD = K.lateDays(p);
    if (lateD) items.push({ p, c: 'var(--danger)', t: p.name, s: st.label + ' devait finir le ' + K.fmt(plan[p.stage].end), w: '+' + lateD + ' j', late: true, href: K.stageUrl(p.stage, p.id), rank: 0 });
    const dl = K.day(p.deadline); const left = dl ? K.diffDays(today, dl) : null;
    if (left != null && left >= 0 && left <= 7) items.push({ p, c: st.color, t: p.name, s: 'Livraison · étape ' + st.label, w: left === 0 ? 'aujourd\'hui' : left === 1 ? 'demain' : K.fmt(p.deadline, { weekday: 'short', day: 'numeric' }), href: 'projet.html?p=' + p.id + '#timeline', rank: 1 + left / 10 });
    else if (!lateD) { const end = K.day(plan[p.stage].end), d = K.diffDays(today, end); if (d >= 0 && d <= 3) items.push({ p, c: st.color, t: p.name, s: 'Fin de l\'étape ' + st.label, w: d === 0 ? 'aujourd\'hui' : d === 1 ? 'demain' : K.fmt(end, { weekday: 'short', day: 'numeric' }), href: K.stageUrl(p.stage, p.id), rank: 2 + d / 10 }); }
  });
  changes.forEach(v => items.push({ p: v._p, c: 'var(--warn)', t: v.title, s: 'Corrections demandées · ' + v._p.name, w: v.status_changed_at ? K.ago(v.status_changed_at) : '', href: 'review.html#/v/' + v.id, rank: .5 }));
  waiting.forEach(v => items.push({ p: v._p, c: 'var(--c-review)', t: v.title, s: 'En attente du client · ' + v._p.name, w: '', href: 'review.html#/v/' + v.id, rank: 3 }));
  items.sort((a, b) => a.rank - b.rank);
  left.append(h('<div class="sec-h"><h2>À traiter</h2>' + (items.length > 7 ? '<a href="timeline.html">Tout voir</a>' : '') + '</div>'));
  if (!items.length) left.append(h('<div class="calm"><b>Rien d\'urgent.</b>Pas de retard, pas d\'échéance dans les 7 jours, aucune vidéo en attente.</div>'));
  else { const box = el('div', 'todo'); items.slice(0, 7).forEach(x => { const a = el('a', 'td'); a.href = x.href; a.style.setProperty('--c', x.c); a.innerHTML = '<span class="c"></span><span class="t"><b>' + esc(x.t) + '</b><span>' + esc(x.s) + '</span></span><span class="w' + (x.late ? ' late' : '') + '">' + esc(x.w) + icon('arrow-right', 15) + '</span>'; box.append(a); }); left.append(box); }

  right.append(h('<div class="sec-h"><h2>Activité</h2></div>'));
  const feed = el('div', 'feed'); right.append(feed);
  feed.append(h('<div class="calm" style="border-bottom:0">Chargement…</div>'));
  K.db.notifications().then(list => {
    feed.textContent = '';
    if (!list.length) { feed.append(h('<div class="calm">Pas encore d\'activité. Les commentaires clients et les validations apparaîtront ici.</div>')); return; }
    list.slice(0, 6).forEach(n => { const a = el('a', 'fd'); a.href = n.href; a.innerHTML = '<span class="ic">' + icon(n.kind === 'comment' ? 'message-square' : n.kind === 'approved' ? 'circle-check' : 'triangle-alert', 16) + '</span><span class="x"><b>' + esc(n.title) + '</b>' + (n.kind === 'comment' && n.sub ? '<q>' + esc(n.sub) + '</q>' : '') + '<span>' + esc([n.kind === 'comment' ? n.project : n.sub, K.ago(n.at)].filter(Boolean).join(' · ')) + '</span></span>'; feed.append(a); });
  }).catch(() => { feed.textContent = ''; feed.append(h('<div class="calm">Activité indisponible pour le moment.</div>')); });

  /* pipeline : où en est chaque projet */
  const pipe = el('section', 'pipe');
  pipe.append(h('<div class="sec-h"><h2>Pipeline</h2><a href="projets.html">Tous les projets</a></div>'));
  const cols = el('div', 'cols');
  K.STAGES.forEach(s => {
    const list = active.filter(p => p.stage === s.k).sort((a, b) => String(a.deadline || '9').localeCompare(String(b.deadline || '9')));
    const c = el('div', 'col'); c.style.setProperty('--c', s.color);
    c.append(h('<div class="ch"><span><i></i>' + esc(s.label) + '</span><em>' + list.length + '</em></div>'));
    if (!list.length) c.append(el('div', 'none', '—'));
    list.forEach(p => {
      const lateD = K.lateDays(p), pl = K.plan(p)[p.stage];
      const span = Math.max(1, K.diffDays(K.day(pl.start), K.day(pl.end)) + 1), done = Math.min(1, Math.max(0, (K.diffDays(K.day(pl.start), today) + 1) / span));
      const a = el('a', 'pj'); a.href = K.stageUrl(p.stage, p.id);
      a.innerHTML = '<b>' + esc(p.name) + '</b><span>' + esc(p.client || K.type(p.type).label) + '</span><div class="bar" title="Temps écoulé sur l\'étape"><i style="width:' + Math.round(done * 100) + '%"></i></div><div class="ft"><span>' + (p.deadline ? esc(K.fmt(p.deadline)) : '') + '</span>' + (lateD ? '<span class="late">+' + lateD + ' j</span>' : '') + '</div>';
      c.append(a);
    });
    cols.append(c);
  });
  pipe.append(cols); dash.append(pipe);
} });
</script>
</body>
</html>
