<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kroma — Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<style>
/* VOICE  : salle de projection du studio, calme et précise
   IDEA   : une table de montage : l'image au centre, la timeline dessous, les retours en marge
   PICTURE: la vidéo elle-même, plein cadre sur fond noir
   COLOUR : noir Kroma #0B0B0B, blanc cassé, gris ; trois pastilles d'état, rien d'autre
   LAYOUT : barre fine en haut ; listes en grille ; lecteur à gauche, commentaires à droite */
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1a1a1a;--line:#222;--ink:#f5f5f4;--mute:#8a8a8a;--dim:#5c5c5c;--ease:cubic-bezier(.22,.61,0,1);--review:#8d8d89;--changes:#e8a84a;--approved:#7fd08a;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 13px/1.45 "Geist",system-ui,-apple-system,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.sq{display:inline-block;width:6px;height:6px;background:currentColor;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dlg{from{opacity:0;transform:translateY(10px)}}
@keyframes pulse{50%{opacity:.4}}

.top{position:fixed;inset:0 0 auto;z-index:30;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;background:rgba(11,11,11,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .logo{height:11px;width:auto;display:block}
.nav{display:flex;gap:2px}
.nav a{padding:5px 11px;border-radius:999px;color:var(--mute);text-decoration:none}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);background:rgba(255,255,255,.07)}
.top .meta{justify-self:end;display:flex;align-items:center;gap:16px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.top .meta b{font-weight:400;color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--mute);cursor:pointer;padding:4px 0}
.linkbtn:hover{color:var(--ink)}

.wrap{padding:96px 16px 80px;animation:rise .8s var(--ease) both}
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px;margin-bottom:28px}
.lab{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12px;margin-bottom:10px}
.lab a{text-decoration:none}.lab a:hover{color:var(--ink)}
h1.big{margin:0;font-size:clamp(26px,3vw,36px);line-height:1.05;font-weight:400;letter-spacing:-.025em;text-wrap:balance}
.fm{color:var(--mute);margin-top:10px}
.acts{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tb{height:34px;padding:0 11px;border:0;border-radius:999px;background:none;color:var(--mute);cursor:pointer;white-space:nowrap}
.tb:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.tb:disabled{opacity:.4;cursor:default}
.go{height:34px;padding:0 15px;border:0;border-radius:999px;background:var(--ink);color:#0b0b0b;font-weight:500;cursor:pointer;white-space:nowrap}
.go:hover{background:#fff}.go:disabled{opacity:.5;cursor:default}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.card{position:relative;background:var(--panel);text-decoration:none;display:block;animation:rise .8s var(--ease) both;transition:background .3s}
.card:hover{background:var(--panel2)}
.thumb{position:relative;aspect-ratio:16/9;background:#0e0e0e;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.card:hover .thumb img{transform:scale(1.025)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)}
.badge{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:999px;background:rgba(11,11,11,.7);backdrop-filter:blur(8px);font-size:12px}
.badge.r{left:auto;right:10px}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--review)}
.dot.changes{background:var(--changes)}.dot.approved{background:var(--approved)}
.cbody{padding:12px 14px 14px}
.cbody .t{font-size:14px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody .m{color:var(--mute);margin-top:3px;font-size:12.5px}
.add{display:grid;place-items:center;min-height:200px;border:1px dashed #2e2e2e;background:none;color:var(--mute);cursor:pointer;transition:border-color .3s,color .3s}
.add:hover,.add.drop{border-color:#777;color:var(--ink)}
.empty{padding:70px 0;text-align:center;color:var(--mute);max-width:46ch;margin:0 auto;line-height:1.55}
.empty b{display:block;color:var(--ink);font-weight:400;font-size:14px;margin-bottom:6px}
.loading{padding:80px 0;text-align:center;color:var(--mute);animation:pulse 1.4s ease-in-out infinite}

/* connexion et réglage */
.center{min-height:100vh;display:grid;place-items:center;padding:80px 20px}
.box{width:min(360px,100%);display:grid;gap:14px;animation:rise .9s var(--ease) both}
.box .logo{width:120px;height:auto;margin-bottom:12px}
.box p{margin:0;color:var(--mute);line-height:1.55}
.box code{background:#1a1a1a;padding:1px 5px;border-radius:4px;font-size:12px}
.field{display:grid;gap:6px;font-size:12px;color:var(--mute)}
.field input,.field textarea,.field select{background:#0f0f0f;border:1px solid var(--line);padding:10px 12px;font-size:15px;outline:0;color:var(--ink);border-radius:0;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#555}
.err{color:#ff8a7a;min-height:18px;font-size:12.5px}

/* lecteur */
.player{position:fixed;inset:44px 0 0 0;display:grid;grid-template-columns:minmax(0,1fr) 380px;animation:rise .7s var(--ease) both}
.left{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.stage{position:relative;background:#000;min-height:0;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage canvas{position:absolute;left:0;top:0;pointer-events:none;touch-action:none}
.stage.drawing canvas{pointer-events:auto;cursor:crosshair}
.drawbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:rgba(24,24,24,.86);border:1px solid var(--line);backdrop-filter:blur(14px)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
.drawbar .tb{height:28px}
.stagemsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none}
.bigplay{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:0;background:rgba(11,11,11,.55);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.bigplay svg{width:18px;height:18px;margin-left:3px}
.bigplay.off{opacity:0;transform:scale(.9);pointer-events:none}
.ctrl{padding:6px 16px 12px;border-top:1px solid var(--line);background:var(--bg)}
.tl{position:relative;height:36px;cursor:pointer;touch-action:none;user-select:none}
.tl .tr{position:absolute;left:0;right:0;top:22px;height:3px;background:#262626}
.tl .pr{position:absolute;left:0;top:22px;height:3px;background:var(--ink);width:0}
.tl .hd{position:absolute;top:15px;width:1px;height:17px;background:var(--ink);transform:translateX(-.5px)}
.tl .hv{position:absolute;top:15px;width:1px;height:17px;background:rgba(255,255,255,.3);display:none}
.tl:hover .hv{display:block}
.mk{position:absolute;top:3px;width:9px;height:9px;margin-left:-4.5px;padding:0;border:0;background:var(--ink);cursor:pointer;transition:transform .2s}
.mk:hover,.mk.sel{transform:scale(1.35)}
.mk.res{background:#4a4a47}
.mk.cl{border-radius:50%}
.tip{position:fixed;z-index:60;max-width:260px;padding:7px 10px;border-radius:8px;background:#1b1b1b;border:1px solid var(--line);font-size:12px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tip b{font-weight:500}
.tip span{color:var(--mute)}
.row{display:flex;align-items:center;gap:4px}
.ib{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--ink);cursor:pointer}
.ib:hover{background:rgba(255,255,255,.07)}
.ib svg{width:14px;height:14px}
.tc{font-variant-numeric:tabular-nums;color:var(--mute);margin-left:8px;white-space:nowrap}
.tc b{font-weight:400;color:var(--ink)}
.sp{flex:1}
.spd{background:none;border:1px solid var(--line);border-radius:999px;height:28px;padding:0 8px;color:var(--mute);cursor:pointer}

.side{border-left:1px solid var(--line);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-height:0;background:#0d0d0d}
.sh{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sh h1{margin:0;font-size:19px;font-weight:400;letter-spacing:-.02em;line-height:1.2}
.sh .m{color:var(--mute);font-size:12.5px}
.sh .acts{gap:4px}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:none}
select.pill{cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:12px}
.tabs{display:flex;gap:2px;padding:8px 12px;border-bottom:1px solid var(--line)}
.tabs button{height:28px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--ink);background:rgba(255,255,255,.07)}
.tabs .n{color:var(--dim);margin-left:4px;font-variant-numeric:tabular-nums}
.list{overflow:auto;padding:6px 8px 20px}
.cm{padding:11px 10px 10px;border-radius:10px;cursor:pointer;transition:background .2s;animation:rise .5s var(--ease) both}
.cm:hover{background:rgba(255,255,255,.035)}
.cm.sel{background:rgba(255,255,255,.06)}
.cm.near .tcb{background:var(--ink);color:#0b0b0b}
.cm.res .cb,.cm.res .au{opacity:.45}
.chd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.tcb{height:22px;padding:0 7px;border-radius:6px;border:0;background:#222;color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;cursor:pointer;transition:background .2s,color .2s}
.au{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
.au .k{width:5px;height:5px;background:currentColor}
.au.client .k{border-radius:50%}
.cb{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.ink{display:inline-flex;align-items:center;gap:5px;color:var(--mute);font-size:12px;margin-top:6px}
.ink svg{width:12px;height:12px;flex:none}
.ca{display:flex;gap:2px;margin-top:6px;margin-left:-8px;opacity:0;transition:opacity .2s}
.cm:hover .ca,.cm.sel .ca,.cm:focus-within .ca{opacity:1}
.ca button{height:26px;padding:0 8px;border:0;border-radius:999px;background:none;color:var(--mute);cursor:pointer;font-size:12px}
.ca button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.ca .done{color:var(--approved)}
.reps{margin:8px 0 0 10px;padding-left:12px;border-left:1px solid var(--line);display:grid;gap:10px}
.rp .cb{margin-top:3px}
.rbox{margin-top:8px;display:grid;gap:6px}
.rbox textarea{width:100%;min-height:58px;resize:vertical;background:#0f0f0f;border:1px solid var(--line);padding:8px 10px;outline:0;font-size:13px}
.rbox textarea:focus{border-color:#555}
.lempty{padding:40px 14px;text-align:center;color:var(--mute);line-height:1.55}
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:8px;background:#0d0d0d}
.composer textarea{width:100%;min-height:64px;max-height:200px;resize:vertical;background:#111;border:1px solid var(--line);padding:10px 12px;outline:0;font-size:14px;line-height:1.45}
.composer textarea:focus{border-color:#555}
.composer .name{height:36px;background:#111;border:1px solid var(--line);padding:0 12px;outline:0;font-size:14px}
.composer .name:focus{border-color:#555}
.chip{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;font-variant-numeric:tabular-nums;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip.on{color:var(--ink);border-color:#555}
.chip svg{width:12px;height:12px}
.hint{color:var(--dim);font-size:11.5px}

/* boîtes de dialogue */
dialog{border:1px solid var(--line);background:#111;color:var(--ink);padding:0;width:min(92vw,460px)}
dialog::backdrop{background:rgba(0,0,0,.8);backdrop-filter:blur(6px)}
dialog[open]{animation:dlg .5s var(--ease)}
.ed{padding:20px;display:grid;gap:14px}
.ed h2{margin:0;font-size:14px;font-weight:500}
.ed p{margin:0;color:var(--mute);line-height:1.5}
.r2{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.r2.sb{justify-content:space-between}
.file{display:grid;place-items:center;gap:4px;min-height:110px;border:1px dashed #333;color:var(--mute);cursor:pointer;text-align:center;padding:12px;transition:border-color .3s,color .3s}
.file:hover,.file.drop{border-color:#777;color:var(--ink)}
.file b{font-weight:400;color:var(--ink);overflow-wrap:anywhere}
.bar{height:2px;background:#262626;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.link{width:100%;background:#0b0b0b;border:1px solid var(--line);padding:10px 12px;font-size:13px;color:var(--ink);outline:0}

#toast{position:fixed;left:50%;top:56px;transform:translate(-50%,-8px);z-index:90;display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:999px;background:rgba(24,24,24,.92);border:1px solid var(--line);backdrop-filter:blur(16px);font-size:12.5px;opacity:0;pointer-events:none;transition:.5s var(--ease);max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .top{grid-template-columns:auto 1fr auto;gap:10px}.top .meta .clk{display:none}
  .player{position:static;display:block;padding-top:44px}
  .stage{height:56vw;min-height:220px}
  .side{border-left:0;border-top:1px solid var(--line);display:block}
  .list{max-height:none}
}
@media (max-width:520px){.spd{display:none}.tc{font-size:12px;margin-left:4px}.ctrl{padding:4px 10px 10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;transition-duration:.01s!important}}

/* ===== intégration dans le shell Kroma v2 (mode studio) ===== */
body.in-shell .top{display:none}
body.in-shell .k-view{padding:0;max-width:none}
body.in-shell .wrap{padding:28px 32px 80px}
body.in-shell .player{inset:var(--hdh) 0 0 var(--mainx)}
body.in-shell #toast{top:72px;left:calc(50% + var(--mainx) / 2)}
body.in-shell .wrap>.k-stage{margin-bottom:22px}
@media (max-width:900px){body.in-shell .player{padding-top:0}body.in-shell .wrap{padding:20px 16px 80px}}
</style>
</head>

</header>
<main id="app"></main>

<dialog id="dp"><form class="ed" method="dialog">
  <h2 id="dpt">Nouveau projet</h2>
  <label class="field">Nom du projet<input id="dpn" type="text" required maxlength="120" placeholder="Ex. Campagne printemps"></label>
  <label class="field">Client<input id="dpc" type="text" maxlength="120" placeholder="Ex. Shotgun"></label>
  <div class="r2"><button class="tb" value="cancel" type="submit" formnovalidate>Annuler</button><button class="go" value="ok" type="submit">Enregistrer</button></div>
</form></dialog>

<dialog id="du"><form class="ed" id="duf">
  <h2 id="dut">Importer une vidéo</h2>
  <label class="file" id="dufz"><input id="duin" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" hidden><span id="dufl">Choisis ou glisse un fichier vidéo<br><span class="hint">MP4 (H.264) conseillé · 50 Mo maximum</span></span></label>
  <label class="field" id="dutw">Titre<input id="dutt" type="text" maxlength="200"></label>
  <label class="field">Images par seconde<select id="dufps"><option>23.976</option><option>24</option><option selected>25</option><option>29.97</option><option>30</option><option>50</option><option>60</option></select></label>

<script>
{
const $=(s,r=document)=>r.querySelector(s);

const app=$('#app');

const IC={
 play:'<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>',

};

/* ---------- horloge, toast, utilitaires ---------- */
const tick=()=>{try{$('#clock').textContent=new Date().toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris'})}catch(e){}};tick();setInterval(tick,1000);

function ago(iso){const d=(Date.now()-new Date(iso).getTime())/1000;if(d<60)return'à l\'instant';if(d<3600)return'il y a '+Math.floor(d/60)+' min';if(d<86400)return'il y a '+Math.floor(d/3600)+' h';if(d<86400*7)return'il y a '+Math.floor(d/86400)+' j';return new Date(iso).toLocaleDateString('fr-FR')}
function tc(t,fps){fps=+fps||25;const r=Math.round(fps);const F=Math.max(0,Math.floor((t||0)*fps+1e-4));const ff=F%r,S=Math.floor(F/r),s=S%60,m=Math.floor(S/60)%60,h=Math.floor(S/3600);const p=n=>String(n).padStart(2,'0');return p(h)+':'+p(m)+':'+p(s)+':'+p(ff)}
const short=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')};

const errMsg=e=>{const m=(e&&(e.message||e.error_description||e.msg))||'Erreur inconnue';return/Failed to fetch|NetworkError/i.test(m)?'Connexion impossible. Vérifie ta connexion internet.':m};
function confirmDlg(title,text,label){return new Promise(res=>{$('#dct').textContent=title;$('#dcp').textContent=text;$('#dcgo').textContent=label||'Supprimer';const d=$('#dc');d.returnValue='';d.showModal();d.addEventListener('close',()=>res(d.returnValue==='ok'),{once:true})})}

/* ---------- accès aux données (Supabase) ---------- */
const cfg=window.KROMA_CONFIG||{};
const SBURL=String(cfg.supabaseUrl||'').replace(/\/$/,''),SBKEY=String(cfg.supabaseKey||cfg.supabaseAnonKey||'');
const BUCKET='review';
const TOKEN=new URLSearchParams(location.search).get('s');
const CLIENT=!!TOKEN;
let RESET=!CLIENT&&(new URLSearchParams(location.search).get('reset')==='1'||/type=recovery/.test(location.hash));
const configured=SBURL&&SBKEY&&!/X{6}/.test(SBURL+SBKEY);
let sb=null;
try{if(!CLIENT&&window.K&&K.sb)sb=K.sb;else if(configured&&window.supabase)sb=window.supabase.createClient(SBURL,SBKEY,{auth:{persistSession:!CLIENT,autoRefreshToken:!CLIENT}})}catch(e){sb=null}
const api=window.KROMA_MOCK||makeApi();
function makeApi(){
  const q=async p=>{const {data,error}=await p;if(error)throw error;return data};
  const pub=p=>SBURL+'/storage/v1/object/public/'+BUCKET+'/'+String(p).split('/').map(encodeURIComponent).join('/');
  return{
    ready:!!sb,
    async session(){const {data}=await sb.auth.getSession();return data.session},
    onAuth(cb){sb.auth.onAuthStateChange((_e,s)=>cb(s))},
    async signIn(email,password){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error},
    signOut:()=>sb.auth.signOut(),
    async resetPassword(email){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?reset=1'});if(error)throw error},
    async setPassword(pw){const {error}=await sb.auth.updateUser({password:pw});if(error)throw error},
    async isStudio(){const {data,error}=await sb.rpc('is_studio');if(error)throw error;return!!data},
    projects:()=>q(sb.from('projects').select('*,videos(id,title,status,created_at,versions(n,thumb))').order('created_at',{ascending:false})),
    project:id=>q(sb.from('projects').select('*').eq('id',id).single()),
    createProject:p=>q(sb.from('projects').insert(p).select().single()),
    updateProject:(id,p)=>q(sb.from('projects').update(p).eq('id',id).select().single()),
    deleteProject:id=>q(sb.from('projects').delete().eq('id',id)),
    videos:pid=>q(sb.from('videos').select('*,versions(*)').eq('project_id',pid).order('created_at',{ascending:false})),
    openCounts:ids=>ids.length?q(sb.from('comments').select('version_id,resolved,parent_id').in('version_id',ids)):Promise.resolve([]),
    video:id=>q(sb.from('videos').select('*,versions(*),projects(id,name,client)').eq('id',id).single()),
    createVideo:v=>q(sb.from('videos').insert(v).select().single()),
    updateVideo:(id,p)=>q(sb.from('videos').update(p).eq('id',id).select().single()),
    deleteVideo:id=>q(sb.from('videos').delete().eq('id',id)),
    createVersion:v=>q(sb.from('versions').insert(v).select().single()),
    comments:vid=>q(sb.from('comments').select('*').eq('version_id',vid).order('created_at')),
    addComment:c=>q(sb.from('comments').insert(c).select().single()),
    updateComment:(id,p)=>q(sb.from('comments').update(p).eq('id',id).select().single()),
    deleteComment:id=>q(sb.from('comments').delete().eq('id',id)),
    async removeFiles(paths){if(paths.length){const {error}=await sb.storage.from(BUCKET).remove(paths);if(error)console.warn(error)}},
    publicUrl:pub,
    async upload(path,blob,onProg){
      const {data}=await sb.auth.getSession();const tok=data.session&&data.session.access_token;if(!tok)throw new Error('Session expirée, reconnecte-toi.');
      return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('POST',SBURL+'/storage/v1/object/'+BUCKET+'/'+path);
        x.setRequestHeader('Authorization','Bearer '+tok);x.setRequestHeader('apikey',SBKEY);x.setRequestHeader('x-upsert','false');x.setRequestHeader('Content-Type',blob.type||'application/octet-stream');
        x.upload.onprogress=e=>{if(e.lengthComputable&&onProg)onProg(e.loaded/e.total)};
        x.onload=()=>{if(x.status>=200&&x.status<300)res(path);else{let m='Envoi refusé ('+x.status+')';try{const j=JSON.parse(x.responseText);m=j.message||j.error||m}catch(e){}if(x.status===413||/size/i.test(m))m='Fichier trop lourd pour l\'offre gratuite (50 Mo maximum).';rej(new Error(m))}};
        x.onerror=()=>rej(new Error('Connexion perdue pendant l\'envoi.'));x.send(blob)})},
    share:t=>q(sb.rpc('share_get',{p_token:t})),
    shareComment:(t,c)=>q(sb.rpc('share_comment',{p_token:t,p_version:c.version_id,p_parent:c.parent_id||null,p_t:c.t==null?null:c.t,p_body:c.body,p_author:c.author,p_drawing:c.drawing||null})),
    shareStatus:(t,s)=>q(sb.rpc('share_status',{p_token:t,p_status:s})),
    subscribe(vid,cb){const ch=sb.channel('cm-'+vid+'-'+uid()).on('postgres_changes',{event:'*',schema:'public',table:'comments',filter:'version_id=eq.'+vid},()=>cb()).subscribe();return()=>{try{sb.removeChannel(ch)}catch(e){}}}
  }}

/* ---------- démarrage et navigation ---------- */
let session=null,cleanup=null;
function setWho(){const w=$('#who');w.textContent='';if(CLIENT||!session)return;const e=el('span',null,(session.user&&session.user.email)||'');const b=el('button','linkbtn','Déconnexion');b.type='button';b.onclick=async()=>{await api.signOut();session=null;location.hash='';route()};w.append(e,document.createTextNode('  ·  '),b)}
function studioName(){const e=(session&&session.user&&session.user.email)||'Kroma';const n=e.split('@')[0].replace(/[._-]+/g,' ');return n.charAt(0).toUpperCase()+n.slice(1)}
async function boot(){
  if(CLIENT){const n=$('#nav');n.textContent='';n.append(el('span',null,'Review'));n.style.color='var(--mute)'}
  if(!api.ready){renderSetup();return}
  if(CLIENT){openShare();return}
  if(window.K){K.boot({active:'review',render:async({view})=>{document.body.classList.add('in-shell');view.append(app);try{session=await api.session()}catch(e){session=null}api.onAuth(s=>{session=s});addEventListener('hashchange',route);route()}});return}
  try{session=await api.session()}catch(e){session=null}
  api.onAuth(s=>{const was=!!session;session=s;if(!!s!==was)route()});
  addEventListener('hashchange',route);route()}
function route(){
  if(cleanup){cleanup();cleanup=null}
  setWho();
  if(RESET&&session){renderSetPassword();return}
  if(!session){renderLogin();return}
  const h=location.hash;let m;
  if((m=h.match(/^#\/p\/([\w-]+)/)))renderProject(m[1]);
  else if((m=h.match(/^#\/v\/([\w-]+)/)))renderVideo(m[1]);
  else renderHome()}
const go=h=>{if(location.hash===h)route();else location.hash=h};

function renderSetup(){app.innerHTML='';const c=el('div','center'),b=el('div','box');const lg=document.createElementNS('http://www.w3.org/2000/svg','svg');lg.setAttribute('viewBox','0 0 1807 331');lg.setAttribute('class','logo');lg.innerHTML=LOGO;
  const why=!window.KROMA_CONFIG?'Le fichier config.js est introuvable sur le site. Vérifie qu\'il est bien à côté de review.html dans le dossier mis en ligne.':!configured?'Le fichier config.js en ligne contient encore les valeurs d\'exemple (XXXX). Enregistre tes vraies valeurs, puis remets le dossier en ligne.':!window.supabase?'La bibliothèque Supabase n\'a pas pu se charger. Vérifie ta connexion, ou un bloqueur de publicités qui bloquerait cdn.jsdelivr.net, puis recharge la page.':'La connexion à Supabase n\'a pas pu démarrer. Vérifie l\'adresse et la clé dans config.js.';
  b.append(lg,el('p',null,CLIENT?'Ce lien de review n\'est pas disponible pour le moment.':why));c.append(b);app.append(c)}

function renderLogin(){app.innerHTML='';const c=el('div','center'),f=el('form','box');const lg=document.createElementNS('http://www.w3.org/2000/svg','svg');lg.setAttribute('viewBox','0 0 1807 331');lg.setAttribute('class','logo');lg.innerHTML=LOGO;
  const e=el('label','field','E-mail');const ei=el('input');ei.type='email';ei.required=true;ei.autocomplete='username';e.append(ei);
  const p=el('label','field','Mot de passe');const pi=el('input');pi.type='password';pi.required=true;pi.autocomplete='current-password';p.append(pi);
  const er=el('div','err');const bt=el('button','go','Se connecter');bt.type='submit';
  const fg=el('button','linkbtn','Créer ou réinitialiser mon mot de passe');fg.type='button';fg.style.justifySelf='center';
  fg.onclick=async()=>{const em=ei.value.trim();er.style.color='';if(!em||!ei.checkValidity()){er.textContent='Indique d\'abord ton e-mail au-dessus.';ei.focus();return}fg.disabled=true;
    try{await api.resetPassword(em);er.style.color='var(--mute)';er.textContent='Si cet e-mail fait partie du studio, un lien vient de t\'être envoyé. Ouvre-le pour choisir ton mot de passe.'}catch(x){const m=x.message||'',sec=m.match(/after (\d+) seconds?/i);er.textContent=sec?'Réessaie dans '+sec[1]+' secondes.':/rate limit/i.test(m)?'Supabase n\'envoie que quelques e-mails par heure avec son service gratuit. Réessaie plus tard, ou crée le mot de passe depuis Supabase (voir LISEZ-MOI.md).':errMsg(x)}fg.disabled=false};
  f.append(lg,el('p',null,'Espace review du studio.'),e,p,er,bt,fg);c.append(f);app.append(c);ei.focus();
  f.onsubmit=async ev=>{ev.preventDefault();bt.disabled=true;er.textContent='';er.style.color='';try{await api.signIn(ei.value.trim(),pi.value);session=await api.session();
    let ok=true;try{ok=await api.isStudio()}catch(x){}
    if(!ok){er.textContent='Ce compte n\'est pas autorisé dans l\'espace studio. Ajoute son e-mail à la table studio_members.';await api.signOut();session=null;bt.disabled=false;return}
    route()}catch(x){er.textContent=/invalid/i.test(x.message||'')?'E-mail ou mot de passe incorrect.':errMsg(x);bt.disabled=false}}}

function renderSetPassword(){app.innerHTML='';const c=el('div','center'),f=el('form','box');const lg=document.createElementNS('http://www.w3.org/2000/svg','svg');lg.setAttribute('viewBox','0 0 1807 331');lg.setAttribute('class','logo');lg.innerHTML=LOGO;
  const mk=(lab,ac)=>{const l=el('label','field',lab);const i=el('input');i.type='password';i.required=true;i.minLength=8;i.autocomplete=ac;l.append(i);return[l,i]};
  const [l1,p1]=mk('Nouveau mot de passe (8 caractères minimum)','new-password'),[l2,p2]=mk('Confirme le mot de passe','new-password');
  const er=el('div','err');const bt=el('button','go','Enregistrer mon mot de passe');bt.type='submit';
  f.append(lg,el('p',null,'Choisis ton mot de passe pour '+((session&&session.user&&session.user.email)||'ton compte')+'.'),l1,l2,er,bt);c.append(f);app.append(c);p1.focus();
  f.onsubmit=async ev=>{ev.preventDefault();er.textContent='';if(p1.value.length<8){er.textContent='8 caractères minimum.';return}if(p1.value!==p2.value){er.textContent='Les deux mots de passe ne sont pas identiques.';return}
    bt.disabled=true;try{await api.setPassword(p1.value);RESET=false;history.replaceState(null,'',location.pathname);toast('Mot de passe enregistré');route()}catch(x){er.textContent=errMsg(x);bt.disabled=false}}}
function hero(lab,title,meta,acts){const h=el('div','hero'),l=el('div');const lb=el('div','lab');lb.append(el('span','sq'));if(lab instanceof Node)lb.append(lab);else lb.append(document.createTextNode(lab));l.append(lb,el('h1','big',title));if(meta)l.append(el('div','fm',meta));const a=el('div','acts');(acts||[]).forEach(x=>a.append(x));h.append(l,a);return h}
function tbtn(txt,fn,cls){const b=el('button',cls||'tb',txt);b.type='button';b.onclick=fn;return b}
function latestVersion(v){const vs=(v.versions||[]).slice().sort((a,b)=>b.n-a.n);return vs[0]}
function thumbFor(v){const lv=latestVersion(v);return lv&&lv.thumb?api.publicUrl(lv.thumb):''}

/* ---------- accueil : projets ---------- */
async function renderHome(){
  if(window.K&&K.setCrumbs)K.setCrumbs([{label:'Review'}]);
  app.innerHTML='';const w=el('div','wrap');app.append(w);
  w.append(hero('Review','Projets',null,[tbtn('+ Nouveau projet',()=>projectDlg(),'go')]));
  const ld=el('div','loading','Chargement');w.append(ld);
  let ps;try{ps=await api.projects()}catch(e){ld.textContent=errMsg(e);ld.style.animation='none';return}
  ld.remove();$('.fm',w)||$('.hero > div',w).append(el('div','fm',plural(ps.length,'projet','projets')));
  if(!ps.length){const e=el('div','empty');e.append(el('b',null,'Aucun projet pour l\'instant.'),document.createTextNode('Crée un projet par client ou par campagne, puis importe tes vidéos dedans.'));w.append(e);return}
  const g=el('div','grid');w.append(g);
  ps.forEach((p,i)=>{const vids=(p.videos||[]).slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const a=el('a','card');a.href='#/p/'+p.id;a.style.animationDelay=Math.min(i,12)*45+'ms';
    const th=el('div','thumb');const cov=vids.map(thumbFor).find(Boolean);if(cov){const im=el('img');im.src=cov;im.alt='';im.loading='lazy';th.append(im)}else th.append(el('div','ph','Aucune vidéo'));
    const ok=vids.filter(v=>v.status==='approved').length;const b=el('div','cbody');b.append(el('div','t',p.name),el('div','m',[p.client,plural(vids.length,'vidéo','vidéos'),ok?ok+(ok>1?' validées':' validée'):''].filter(Boolean).join(' · ')));
    a.append(th,b);g.append(a)})}

function projectDlg(p){const d=$('#dp');$('#dpt').textContent=p?'Modifier le projet':'Nouveau projet';$('#dpn').value=p?p.name:'';$('#dpc').value=p?p.client||'':'';d.returnValue='';d.showModal();$('#dpn').focus();
  d.addEventListener('close',async()=>{if(d.returnValue!=='ok')return;const data={name:$('#dpn').value.trim().slice(0,120),client:$('#dpc').value.trim().slice(0,120)};if(!data.name)return;
    try{if(p){await api.updateProject(p.id,data);route()}else{const np=await api.createProject(data);go('#/p/'+np.id)}}catch(e){toast(errMsg(e))}},{once:true})}

/* ---------- projet : vidéos ---------- */
async function renderProject(id){
  app.innerHTML='';const w=el('div','wrap');app.append(w);const ld=el('div','loading','Chargement');w.append(ld);
  let p,vids,counts;try{[p,vids]=await Promise.all([api.project(id),api.videos(id)]);counts=await api.openCounts(vids.flatMap(v=>(v.versions||[]).map(x=>x.id)))}catch(e){ld.textContent=errMsg(e);ld.style.animation='none';return}
  ld.remove();
  if(window.K&&K.setCrumbs){K.setCrumbs([{label:'Review',href:'#/'},{label:p.name}]);const kp=(K.state.projects||[]).find(x=>x.id===p.id);if(kp){K.store.set('kroma-last-project',kp.id);w.append(K.stageHeader(kp,'review',{compact:true,onChange:()=>route()}))}}
  const back=el('a',null,'Projets');back.href='#/';
  w.append(hero(back,p.name,[p.client?'Client · '+p.client:'',plural(vids.length,'vidéo','vidéos')].filter(Boolean).join('  —  '),[
    tbtn('Modifier',()=>projectDlg(p)),
    tbtn('Supprimer',async()=>{if(!await confirmDlg('Supprimer le projet ?','Le projet « '+p.name+' », ses '+plural(vids.length,'vidéo','vidéos')+' et tous leurs commentaires seront supprimés définitivement.'))return;
      try{await api.removeFiles(vids.flatMap(v=>(v.versions||[]).flatMap(x=>[x.path,x.thumb].filter(Boolean))));await api.deleteProject(p.id);toast('Projet supprimé');go('#/')}catch(e){toast(errMsg(e))}}),
    tbtn('+ Importer une vidéo',()=>uploadDlg({project:p}),'go')]));
  const g=el('div','grid');w.append(g);
  const open={};counts.forEach(c=>{if(!c.parent_id&&!c.resolved)open[c.version_id]=(open[c.version_id]||0)+1});
  vids.forEach((v,i)=>{const lv=latestVersion(v);const a=el('a','card');a.href='#/v/'+v.id;a.style.animationDelay=Math.min(i,12)*45+'ms';
    const th=el('div','thumb');const src=thumbFor(v);if(src){const im=el('img');im.src=src;im.alt='';im.loading='lazy';th.append(im)}else th.append(el('div','ph','Pas d\'aperçu'));
    const bd=el('div','badge');bd.append(el('span','dot '+v.status),document.createTextNode(STATUS[v.status]||''));th.append(bd);
    if(lv){const br=el('div','badge r','V'+lv.n+(lv.duration?' · '+short(lv.duration):''));th.append(br)}
    const n=lv?open[lv.id]||0:0;const b=el('div','cbody');b.append(el('div','t',v.title),el('div','m',n?plural(n,'commentaire ouvert','commentaires ouverts'):'Aucun commentaire ouvert'));a.append(th,b);g.append(a)});
  const add=el('button','add','+ Importer une vidéo');add.type='button';add.onclick=()=>uploadDlg({project:p});g.append(add);
  const dz=e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();add.classList.add('drop')}};
  const dl=()=>add.classList.remove('drop');
  const dr=e=>{if(!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();dl();uploadDlg({project:p,file:e.dataTransfer.files[0]})};
  document.addEventListener('dragover',dz);document.addEventListener('dragleave',dl);document.addEventListener('drop',dr);
  cleanup=()=>{document.removeEventListener('dragover',dz);document.removeEventListener('dragleave',dl);document.removeEventListener('drop',dr)}}

/* ---------- import d'une vidéo ou d'une nouvelle version ---------- */
function probe(file){return new Promise((res,rej)=>{const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;const u=URL.createObjectURL(file);let done=false;
  const fail=()=>{if(done)return;done=true;URL.revokeObjectURL(u);rej(new Error('Le navigateur ne sait pas lire ce fichier. Exporte-le en MP4 (H.264).'))};

function uploadDlg({project,video,file}){

          try{const row=await ctx.add(Object.assign({version_id:ver.id,parent_id:c.id,t:null,body},ctx.author()));comments.push(row);replyTo=null;refresh()}catch(e){toast(errMsg(e));send.disabled=false}},'go');
        t.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))send.click()};r2.append(tbtn('Annuler',()=>{replyTo=null;renderList()}),send);rb.append(t,r2);rb.onclick=e=>e.stopPropagation();it.append(rb);setTimeout(()=>t.focus(),0)}
      it.onclick=e=>{if(e.target.closest('button,textarea,a'))return;select(c.id,true)};
      list.append(it)});paint()}
  function select(id,jump){selId=id;const c=comments.find(x=>x.id===id);setDraw(false);if(jump&&c&&c.t!=null){vid.pause();seek(c.t)}renderList();renderMarkers();const n=list.querySelector('[data-id="'+id+'"]');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})}
  async function patch(c,p){try{const r=await ctx.update(c.id,p);Object.assign(c,r||p);refresh()}catch(e){toast(errMsg(e))}}
  async function delComment(c){if(!await confirmDlg('Supprimer ce commentaire ?','Le commentaire'+(comments.some(r=>r.parent_id===c.id)?' et ses réponses seront supprimés.':' sera supprimé.')))return;try{await ctx.remove(c.id);comments=comments.filter(x=>x.id!==c.id&&x.parent_id!==c.id);if(selId===c.id)selId=null;refresh()}catch(e){toast(errMsg(e))}}
  function refresh(){renderTabs();renderList();renderMarkers()}

  /* --- zone de saisie --- */
  const nameIn=el('input','name');nameIn.placeholder='Ton prénom (affiché avec tes commentaires)';nameIn.maxLength=80;nameIn.setAttribute('aria-label','Ton prénom');nameIn.value=store.get('kroma-client-name','');
  const ta=el('textarea');ta.setAttribute('aria-label','Commentaire');
  const r2=el('div','row');const chip=el('button','chip on');chip.type='button';const drawB=el('button','chip');drawB.type='button';drawB.innerHTML=IC.pen;drawB.append(document.createTextNode(' Dessiner'));
  const sendB=tbtn('Envoyer',()=>send(),'go');r2.append(chip,drawB,el('span','sp'),el('span','hint','⌘ ↵'),sendB);
  if(C&&!nameIn.value)comp.append(nameIn);comp.append(ta,r2);
  chip.onclick=()=>{useTc=!useTc;updChip()};drawB.onclick=()=>setDraw(!drawing);
  function updChip(){chip.classList.toggle('on',useTc);chip.innerHTML=IC.clock;chip.append(document.createTextNode(useTc?' '+tc(vid.currentTime,fps):' Sans timecode'));ta.placeholder=useTc?'Ton retour à '+tc(vid.currentTime,fps)+'…':'Un retour général sur la vidéo…'}
  function syncDraw(){drawB.classList.toggle('on',drawing||draft.length>0);drawB.innerHTML=IC.pen;drawB.append(document.createTextNode(draft.length?' Dessin joint ('+draft.length+')':' Dessiner'))}
  ta.addEventListener('focus',()=>{if(!vid.paused)vid.pause()});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send()}});
  async function ensureName(){if(!C)return true;let n=(nameIn.value||store.get('kroma-client-name','')).trim();if(!n){if(!nameIn.isConnected)comp.prepend(nameIn);nameIn.focus();toast('Indique ton prénom pour signer tes commentaires');return false}store.set('kroma-client-name',n);return true}
  async function send(){const body=ta.value.trim();if(!body){ta.focus();return}if(!await ensureName())return;sendB.disabled=true;
    const c=Object.assign({version_id:ver.id,parent_id:null,t:useTc?Math.round(vid.currentTime*1000)/1000:null,body,drawing:draft.length?{s:draft}:null},ctx.author());
    try{const row=await ctx.add(c);comments.push(row);ta.value='';draft=[];setDraw(false);selId=row.id;if(C&&nameIn.isConnected&&nameIn.value.trim())nameIn.remove();filter=filter==='done'?'all':filter;refresh();toast('Commentaire envoyé')}
    catch(e){toast(errMsg(e))}sendB.disabled=false}

  /* --- versions et données --- */
  async function setVersion(nv,keep){ver=nv;fps=+ver.fps||25;selId=null;replyTo=null;draft=[];setDraw(false);renderHead();msg.textContent='Chargement';
    const t=keep?vid.currentTime:0;vid.src=api.publicUrl(ver.path);if(t)vid.addEventListener('loadedmetadata',()=>seek(t),{once:true});
    if(ver.thumb)vid.poster=api.publicUrl(ver.thumb);
    try{comments=await ctx.load(ver,false)}catch(e){comments=[];toast(errMsg(e))}refresh();
    ctx.watch(ver,async()=>{try{const fresh=await ctx.load(ver,true);if(!alive)return;comments=fresh;refresh();if(C)renderHead()}catch(e){}})}

  /* --- clavier --- */
  const key=e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;if(document.querySelector('dialog[open]'))return;
    if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowLeft'){e.preventDefault();e.shiftKey?seek(vid.currentTime-1):step(-1)}else if(e.key==='ArrowRight'){e.preventDefault();e.shiftKey?seek(vid.currentTime+1):step(1)}else if(e.key==='Escape'&&drawing)setDraw(false)};
  document.addEventListener('keydown',key);
  renderHead();setVersion(ver);
  return()=>{alive=false;cancelAnimationFrame(raf);ro.disconnect();document.removeEventListener('keydown',key);tip.remove();vid.removeAttribute('src');vid.load()}}

boot();
}
</script>
</body>
